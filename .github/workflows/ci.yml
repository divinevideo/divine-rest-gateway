name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Unit and protocol tests
        run: cargo test --locked --lib
      - name: Deployment guard and verification tests (offline)
        run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - name: Verify runtime-test harness compiles
        run: cargo test --locked --test short_links_local --no-run
      - name: Build the Worker and verify bindings without deploying
        run: |
          npx --yes wrangler@4.50.0 deploy --dry-run --outdir .wrangler/release
          python3 scripts/deploy.py --prepare
          npx --offline --yes wrangler@4.50.0 deploy --no-bundle --config .wrangler-release.toml --dry-run
      - name: Retain this run's checked Worker bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-worker
          path: |
            .wrangler/release/*.js
            .wrangler/release/*.wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's checked Worker bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-worker
          path: .wrangler/release
      - name: Prepare the trusted uploader without deployment credentials
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.50.0 --version
          python3 scripts/deploy.py --prepare
      - name: Deploy checked main commit and verify production
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 scripts/deploy.py
