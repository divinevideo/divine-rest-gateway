name = "divine-rest-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain
routes = [
  { pattern = "gateway.divine.video", custom_domain = true }
]

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[build]
command = "cargo install -q worker-build --version 0.7.1 --locked && worker-build --release"

# Default relay - override in .dev.vars or secrets
[vars]
RELAY_URL = "wss://relay.divine.video"
SHORT_LINK_CREATION_ENABLED = "false"

# KV namespace for caching
[[kv_namespaces]]
binding = "REST_GATEWAY_CACHE"
id = "7defa88baf784c46b44ec37f1cf33c87"
preview_id = "950d141278b145e3a7e8c6f3e64a30bc"

# Durable Object for relay connections
[[durable_objects.bindings]]
name = "RELAY_POOL"
class_name = "RelayPool"

[[migrations]]
tag = "v1"
new_classes = ["RelayPool"]

# Publish queue
[[queues.producers]]
queue = "divine-publish-events"
binding = "PUBLISH_QUEUE"

[[queues.consumers]]
queue = "divine-publish-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "divine-publish-failed"

# Rate limiting (using Cloudflare's built-in)
# Configure via dashboard or use KV-based in code

# Body-bound creator quotas; the bearer is configured with wrangler secret put.
[[durable_objects.bindings]]
name = "SHORT_LINK_LIMITER"
class_name = "ShortLinkLimiter"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShortLinkLimiter"]
